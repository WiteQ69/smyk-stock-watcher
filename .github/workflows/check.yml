name: Check availability
on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
permissions:
  contents: read
concurrency:
  group: stock-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check stores and report changes
        env:
          MONITOR_ENDPOINT: ${{ secrets.MONITOR_ENDPOINT }}
          MONITOR_AGENT_KEY: ${{ secrets.MONITOR_AGENT_KEY }}
        run: node agent/collect.mjs
